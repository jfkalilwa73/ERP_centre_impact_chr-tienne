openapi: 3.0.3

info:
  title: ERP de l'Église - API contractuelle Phase 0
  version: 1.3.0
  description: |
    Contrat officiel entre le Frontend React, le Backend Laravel (PHP)
    et PostgreSQL pour le socle transverse de la Phase 0.

    RÈGLE D'OR DU PROJET :
    Ce document fait autorité. Toute divergence entre le code et ce contrat est un bug.

    PÉRIMÈTRE :
    Personnes, comptes, authentification minimale, rôles, permissions,
    sites, départements, familles d'impact, affectations et consultation de l'audit.

  contact:
    name: Équipe de développement ERP de l'Église
  x-backend-framework: Laravel

servers:
  - url: /api/v1
    description: URL commune aux environnements Development, Staging et Production

tags:
  - name: Authentification
    description: Connexion, déconnexion et utilisateur courant
  - name: Personnes
    description: Gestion des identités physiques
  - name: Comptes
    description: Gestion des comptes de connexion
  - name: Rôles & Permissions
    description: RBAC, affectations et vérification des droits
  - name: Sites & Départements
    description: Structure organisationnelle de la Phase 0
  - name: Familles d'impact
    description: Cellules de proximité et appartenance des personnes
  - name: Audit
    description: Consultation des traces créées automatiquement

security:
  - BearerAuth: []

components:
  # ==========================================================
  # SÉCURITÉ
  # ==========================================================
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Access token JWT de la session courante, valable 1 heure.
        Le refresh token, valable 7 jours, n'est jamais utilisé comme Bearer.
        Le renouvellement et la révocation sont gérés dans Laravel sans route publique.

  # ==========================================================
  # PARAMÈTRES RÉUTILISABLES
  # ==========================================================
  parameters:
    Page:
      name: page
      in: query
      description: Numéro de page
      schema: { type: integer, minimum: 1, default: 1 }
    Limit:
      name: limit
      in: query
      description: Nombre d'éléments par page
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Search:
      name: q
      in: query
      description: Recherche textuelle
      schema: { type: string, maxLength: 100 }
    PersonneId:
      name: personneId
      in: path
      required: true
      schema: { type: string, format: uuid }
    CompteId:
      name: compteId
      in: path
      required: true
      schema: { type: string, format: uuid }
    RoleId:
      name: roleId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PermissionId:
      name: permissionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SiteId:
      name: siteId
      in: path
      required: true
      schema: { type: string, format: uuid }
    DepartementId:
      name: departementId
      in: path
      required: true
      schema: { type: string, format: uuid }
    FamilleId:
      name: familleId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AuditId:
      name: auditId
      in: path
      required: true
      schema: { type: string, format: uuid }

  # ==========================================================
  # RÉPONSES STANDARDISÉES
  # ==========================================================
  responses:
    UnauthorizedError:
      description: Authentification absente, invalide ou expirée
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    ForbiddenError:
      description: Permission insuffisante
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFoundError:
      description: Ressource introuvable
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    ConflictError:
      description: Conflit avec l'état courant ou une contrainte BDD
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    ValidationError:
      description: Payload non conforme
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }

  # ==========================================================
  # DTOs — MAPPAGE API / POSTGRESQL
  # JSON : camelCase | PostgreSQL : snake_case
  # ==========================================================
  schemas:
    ErrorResponse:
      type: object
      required: [status, code, message]
      properties:
        status: { type: integer, example: 422 }
        code: { type: string, example: VALIDATION_ERROR }
        message: { type: string, example: Données non conformes }
        details:
          type: array
          items: { type: object }
        requestId: { type: string, example: req_01JABCXYZ }

    Pagination:
      type: object
      required: [page, limit, total]
      properties:
        page: { type: integer, example: 1 }
        limit: { type: integer, example: 20 }
        total: { type: integer, example: 42 }

    # --------------------------------------------------------
    # AUTHENTIFICATION
    # CIBLE : formulaire React de connexion
    # BACKEND : Laravel (validation Request, Hash, middleware auth/RBAC)
    # BDD : compte + personne + token
    # --------------------------------------------------------
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, motDePasse]
      properties:
        email: { type: string, format: email, example: admin@eglise.org }
        motDePasse: { type: string, format: password, minLength: 8, example: SecurePass123! }

    LoginResponse:
      type: object
      required:
        - accessToken
        - refreshToken
        - tokenType
        - accessTokenExpiresIn
        - refreshTokenExpiresIn
        - utilisateur
      properties:
        accessToken:
          type: string
          description: JWT de type `access`, valable 1 heure.
        refreshToken:
          type: string
          description: Jeton de type `refresh`, valable 7 jours et traité par Laravel.
        tokenType: { type: string, default: Bearer }
        accessTokenExpiresIn:
          type: integer
          enum: [3600]
          example: 3600
          description: Durée de vie de l'access token en secondes.
        refreshTokenExpiresIn:
          type: integer
          enum: [604800]
          example: 604800
          description: Durée de vie du refresh token en secondes.
        utilisateur: { $ref: '#/components/schemas/CurrentUser' }
      # BDD : Laravel stocke uniquement le hash de chaque token dans `token`.
      # RÈGLE : aucun endpoint /auth/refresh ni /tokens n'est exposé.

    CurrentUser:
      type: object
      required: [compte, personne, roles, permissions]
      properties:
        compte: { $ref: '#/components/schemas/Compte' }
        personne: { $ref: '#/components/schemas/Personne' }
        roles:
          type: array
          items: { $ref: '#/components/schemas/Role' }
        permissions:
          type: array
          uniqueItems: true
          items: { type: string, example: membres.read }

    # --------------------------------------------------------
    # PERSONNE
    # BDD : personne
    # --------------------------------------------------------
    PersonneCreate:
      type: object
      required: [nom, prenom]
      properties:
        nom: { type: string, minLength: 1, maxLength: 100, example: KABILA }
        prenom: { type: string, minLength: 1, maxLength: 100, example: Jean }
        dateNaissance: { type: string, format: date, example: '1995-08-12' }
        sexe: { type: string, enum: [M, F], example: M }
        telephone: { type: string, maxLength: 20, example: '+243810000000' }
        adresse: { type: string, example: Kinshasa }
        photoUrl: { type: string, format: uri, maxLength: 500 }
        statut: { $ref: '#/components/schemas/PersonneStatut' }

    PersonneUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        nom: { type: string, minLength: 1, maxLength: 100 }
        prenom: { type: string, minLength: 1, maxLength: 100 }
        dateNaissance: { type: string, format: date }
        sexe: { type: string, enum: [M, F] }
        telephone: { type: string, maxLength: 20 }
        adresse: { type: string }
        photoUrl: { type: string, format: uri, maxLength: 500 }
        statut: { $ref: '#/components/schemas/PersonneStatut' }

    Personne:
      allOf:
        - $ref: '#/components/schemas/PersonneCreate'
        - type: object
          required: [idPersonne, dateCreation, dateModification]
          properties:
            idPersonne: { type: string, format: uuid, readOnly: true }
            dateCreation: { type: string, format: date-time, readOnly: true }
            dateModification: { type: string, format: date-time, readOnly: true }

    PersonneStatut:
      type: string
      enum: [actif, inactif, archive]
      default: actif

    PersonnePage:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Personne' }
        pagination: { $ref: '#/components/schemas/Pagination' }

    # --------------------------------------------------------
    # COMPTE
    # BDD : compte
    # SÉCURITÉ : mot_de_passe_hash n'est jamais retourné.
    # --------------------------------------------------------
    CompteCreate:
      type: object
      additionalProperties: false
      required: [idPersonne, email, motDePasse]
      properties:
        idPersonne: { type: string, format: uuid }
        email: { type: string, format: email, example: jean@eglise.org }
        motDePasse: { type: string, format: password, minLength: 8, example: SecurePass123! }
        statut: { $ref: '#/components/schemas/CompteStatut' }

    CompteUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        email: { type: string, format: email }
        statut: { $ref: '#/components/schemas/CompteStatut' }
        mfaActive: { type: boolean }

    Compte:
      type: object
      required: [idCompte, idPersonne, email, statut, mfaActive, dateCreation]
      properties:
        idCompte: { type: string, format: uuid, readOnly: true }
        idPersonne: { type: string, format: uuid }
        email: { type: string, format: email }
        statut: { $ref: '#/components/schemas/CompteStatut' }
        derniereConnexion: { type: string, format: date-time, readOnly: true }
        mfaActive: { type: boolean, default: false }
        dateCreation: { type: string, format: date-time, readOnly: true }
        dateDesactivation: { type: string, format: date-time, readOnly: true }

    CompteStatut:
      type: string
      enum: [actif, suspendu, desactive]
      default: actif

    ComptePage:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Compte' }
        pagination: { $ref: '#/components/schemas/Pagination' }

    # --------------------------------------------------------
    # RBAC
    # BDD : role, permission, affecter_role, attribuer
    # --------------------------------------------------------
    RoleCreate:
      type: object
      required: [code, nom]
      properties:
        code:
          type: string
          pattern: '^[A-Z][A-Z0-9_]*$'
          example: ADMIN_FONCTIONNEL
          description: >
            Code du rôle. Référence métier du cahier des charges :
            ADMIN_FONCTIONNEL, ADMIN_TECHNIQUE, PASTEUR, CONSEIL_PASTORAL,
            MEMBRE_DGE, SUPERVISEUR, CHEF_DEPARTEMENT, RESPONSABLE_PROJETS,
            FINANCE_COMPTABLE, CAISSIER, RH, ACHATS, LOGISTIQUE, PROTOCOLE_PASTEUR,
            AUDIT_COMPLIANCE, SECRETARIAT, ARCHIVISTE, TECHNICIEN, BENEVOLE, MEMBRE.
            Une personne peut cumuler plusieurs rôles ; les permissions s'additionnent
            sans lever les restrictions de confidentialité (notes pastorales, salaires).
            SUPERVISEUR : au-dessus des chefs, uniquement les départements affectés
            sauf permission explicite supplémentaire (consultation équipes, activités,
            objectifs, budgets, projets, rapports, consolidation, performances, demandes, alertes).
            CHEF_DEPARTEMENT : équipe, activités, demandes, objectifs, budget, projets et rapports
            de son département uniquement.
        nom: { type: string, maxLength: 100, example: Administrateur fonctionnel }
        description: { type: string }
        niveauConfidentialite: { type: integer, minimum: 1, default: 1 }
        actif: { type: boolean, default: true }

    RoleUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        code: { type: string, pattern: '^[A-Z][A-Z0-9_]*$' }
        nom: { type: string, maxLength: 100 }
        description: { type: string }
        niveauConfidentialite: { type: integer, minimum: 1 }
        actif: { type: boolean }

    Role:
      allOf:
        - $ref: '#/components/schemas/RoleCreate'
        - type: object
          required: [idRole, dateCreation]
          properties:
            idRole: { type: string, format: uuid, readOnly: true }
            dateCreation: { type: string, format: date-time, readOnly: true }

    RolePage:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Role' }
        pagination: { $ref: '#/components/schemas/Pagination' }

    PermissionCreate:
      type: object
      required: [code, module, action]
      properties:
        code:
          type: string
          pattern: '^[a-z][a-z0-9_-]*\.[a-z][a-z0-9_-]*$'
          example: membres.read
        module: { type: string, maxLength: 50, example: membres }
        action: { type: string, maxLength: 50, example: read }
        description: { type: string }
        actif: { type: boolean, default: true }

    PermissionUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        code: { type: string, pattern: '^[a-z][a-z0-9_-]*\.[a-z][a-z0-9_-]*$' }
        module: { type: string, maxLength: 50 }
        action: { type: string, maxLength: 50 }
        description: { type: string }
        actif: { type: boolean }

    Permission:
      allOf:
        - $ref: '#/components/schemas/PermissionCreate'
        - type: object
          required: [idPermission]
          properties:
            idPermission: { type: string, format: uuid, readOnly: true }

    PermissionPage:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Permission' }
        pagination: { $ref: '#/components/schemas/Pagination' }

    AffectationRoleCreate:
      type: object
      additionalProperties: false
      required: [idRole]
      properties:
        idRole: { type: string, format: uuid }
        dateDebut: { type: string, format: date-time }
        dateFin: { type: string, format: date-time }

    AffectationRole:
      type: object
      required: [idCompte, idRole, dateDebut, actif]
      properties:
        idCompte: { type: string, format: uuid }
        idRole: { type: string, format: uuid }
        dateDebut: { type: string, format: date-time }
        dateFin: { type: string, format: date-time }
        actif: { type: boolean }

    RolePermissionCreate:
      type: object
      additionalProperties: false
      required: [idPermission]
      properties:
        idPermission: { type: string, format: uuid }

    PermissionCheck:
      type: object
      required: [compteId, permissionCode, autorise]
      properties:
        compteId: { type: string, format: uuid }
        permissionCode: { type: string, example: membres.read }
        autorise: { type: boolean, example: true }
        rolesSource:
          type: array
          items: { type: string, format: uuid }

    # --------------------------------------------------------
    # ORGANISATION
    # BDD : site, departement, affecter_departement
    # --------------------------------------------------------
    SiteCreate:
      type: object
      required: [code, nom, telephone]
      properties:
        code: { type: string, maxLength: 20, example: KIN-CENTRE }
        nom: { type: string, maxLength: 100, example: Site central }
        adresse: { type: string, example: Avenue de l'Église }
        ville: { type: string, maxLength: 100, example: Kinshasa }
        pays: { type: string, maxLength: 100, example: RDC }
        telephone: { type: string, maxLength: 20, example: '+243810000001' }
        actif: { type: boolean, default: true }

    SiteUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        code: { type: string, maxLength: 20 }
        nom: { type: string, maxLength: 100 }
        adresse: { type: string }
        ville: { type: string, maxLength: 100 }
        pays: { type: string, maxLength: 100 }
        telephone: { type: string, maxLength: 20 }
        actif: { type: boolean }

    Site:
      allOf:
        - $ref: '#/components/schemas/SiteCreate'
        - type: object
          required: [idSite, dateCreation]
          properties:
            idSite: { type: string, format: uuid, readOnly: true }
            dateCreation: { type: string, format: date-time, readOnly: true }

    SitePage:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Site' }
        pagination: { $ref: '#/components/schemas/Pagination' }

    DepartementCreate:
      type: object
      required: [code, nom, idSite]
      properties:
        code: { type: string, maxLength: 20, example: ACCUEIL }
        nom: { type: string, maxLength: 100, example: Département Accueil }
        mission: { type: string }
        idSite: { type: string, format: uuid }
        actif: { type: boolean, default: true }

    DepartementUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        code: { type: string, maxLength: 20 }
        nom: { type: string, maxLength: 100 }
        mission: { type: string }
        idSite: { type: string, format: uuid }
        actif: { type: boolean }

    Departement:
      allOf:
        - $ref: '#/components/schemas/DepartementCreate'
        - type: object
          required: [idDepartement, dateCreation]
          properties:
            idDepartement: { type: string, format: uuid, readOnly: true }
            dateCreation: { type: string, format: date-time, readOnly: true }

    DepartementPage:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Departement' }
        pagination: { $ref: '#/components/schemas/Pagination' }

    AffectationDepartementCreate:
      type: object
      additionalProperties: false
      required: [idDepartement]
      properties:
        idDepartement: { type: string, format: uuid }
        fonction: { type: string, maxLength: 100, example: Responsable accueil }
        dateDebut: { type: string, format: date-time }
        dateFin: { type: string, format: date-time }

    AffectationDepartement:
      type: object
      required: [idPersonne, idDepartement, dateDebut, actif]
      properties:
        idPersonne: { type: string, format: uuid }
        idDepartement: { type: string, format: uuid }
        fonction: { type: string, maxLength: 100 }
        dateDebut: { type: string, format: date-time }
        dateFin: { type: string, format: date-time }
        actif: { type: boolean }

    # --------------------------------------------------------
    # FAMILLES D'IMPACT
    # BDD : famille_impact, appartenir_famille
    # RÈGLE : une personne appartient au plus à une famille active.
    # --------------------------------------------------------
    FamilleImpactCreate:
      type: object
      required: [code, nom]
      properties:
        code:
          type: string
          maxLength: 20
          example: BATISSEURS
        nom: { type: string, maxLength: 100, example: Bâtisseurs }
        zone: { type: string, maxLength: 100, example: Nord }
        description: { type: string }
        actif: { type: boolean, default: true }

    FamilleImpactUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        code: { type: string, maxLength: 20 }
        nom: { type: string, maxLength: 100 }
        zone: { type: string, maxLength: 100 }
        description: { type: string }
        actif: { type: boolean }

    FamilleImpact:
      allOf:
        - $ref: '#/components/schemas/FamilleImpactCreate'
        - type: object
          required: [idFamille, dateCreation]
          properties:
            idFamille: { type: string, format: uuid, readOnly: true }
            dateCreation: { type: string, format: date-time, readOnly: true }

    FamilleImpactPage:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/FamilleImpact' }
        pagination: { $ref: '#/components/schemas/Pagination' }

    AffectationFamilleCreate:
      type: object
      additionalProperties: false
      required: [idFamille]
      properties:
        idFamille: { type: string, format: uuid }
        fonction: { type: string, maxLength: 100, example: Responsable }
        dateDebut: { type: string, format: date-time }
        dateFin: { type: string, format: date-time }

    AffectationFamille:
      type: object
      required: [idPersonne, idFamille, dateDebut, actif]
      properties:
        idPersonne: { type: string, format: uuid }
        idFamille: { type: string, format: uuid }
        fonction: { type: string, maxLength: 100 }
        dateDebut: { type: string, format: date-time }
        dateFin: { type: string, format: date-time }
        actif: { type: boolean }

    # --------------------------------------------------------
    # AUDIT
    # BDD : audit_log
    # RÈGLE : DTO de sortie uniquement, écriture côté serveur.
    # --------------------------------------------------------
    AuditLog:
      type: object
      required: [idAudit, action, entiteType, idEntite, dateAction]
      properties:
        idAudit: { type: string, format: uuid, readOnly: true }
        idCompte: { type: string, format: uuid }
        action: { type: string, example: PERSONNE_CREATED }
        entiteType: { type: string, example: personne }
        idEntite: { type: string, format: uuid }
        anciennesValeurs: { type: object }
        nouvellesValeurs: { type: object }
        adresseIp: { type: string, example: 192.0.2.10 }
        userAgent: { type: string }
        dateAction: { type: string, format: date-time, readOnly: true }

    AuditLogPage:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/AuditLog' }
        pagination: { $ref: '#/components/schemas/Pagination' }

# ============================================================
# ROUTES API — PHASE 0 UNIQUEMENT
# ============================================================
paths:
  # ----------------------------------------------------------
  # AUTHENTIFICATION
  # ----------------------------------------------------------
  /auth/login:
    post:
      tags: [Authentification]
      operationId: login
      summary: Authentifier un compte
      security: []
      # CIBLE : formulaire de connexion React
      # BACKEND : Laravel FormRequest + Hash::check + service d'authentification
      # BDD : SELECT compte + personne, puis INSERT de deux hashes dans token
      # TOKENS : access=1h, refresh=7j
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Session ouverte
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /auth/logout:
    post:
      tags: [Authentification]
      operationId: logout
      summary: Fermer la session courante
      # BACKEND : Laravel révoque les deux tokens de la session courante.
      # RÈGLE : aucun endpoint public de gestion des tokens.
      responses:
        '204': { description: Session fermée }
        '401': { $ref: '#/components/responses/UnauthorizedError' }

  /auth/me:
    get:
      tags: [Authentification]
      operationId: getCurrentUser
      summary: Récupérer l'utilisateur et ses droits effectifs
      responses:
        '200':
          description: Contexte courant
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentUser' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }

  # ----------------------------------------------------------
  # PERSONNES
  # ----------------------------------------------------------
  /personnes:
    get:
      tags: [Personnes]
      operationId: listPersonnes
      summary: Lister les personnes
      # BDD : SELECT personne avec recherche, filtre et pagination
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Search' }
        - name: statut
          in: query
          schema: { $ref: '#/components/schemas/PersonneStatut' }
      responses:
        '200':
          description: Liste paginée
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PersonnePage' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
