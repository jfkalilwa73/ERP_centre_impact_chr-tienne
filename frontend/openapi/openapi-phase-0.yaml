      tags: [Sites & Départements]
      operationId: deleteDepartement
      summary: Supprimer un département non utilisé
      responses:
        '204': { description: Département supprimé }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '409': { $ref: '#/components/responses/ConflictError' }

  # ----------------------------------------------------------
  # FAMILLES D'IMPACT
  # ----------------------------------------------------------
  /familles-impact:
    get:
      tags: [Familles d'impact]
      operationId: listFamilles
      summary: Lister les familles d'impact
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Search' }
      responses:
        '200':
          description: Liste paginée
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FamilleImpactPage' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
    post:
      tags: [Familles d'impact]
      operationId: createFamille
      summary: Créer une famille d'impact
      # BDD : INSERT famille_impact ; nom unique
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FamilleImpactCreate' }
      responses:
        '201':
          description: Famille créée
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FamilleImpact' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '409': { $ref: '#/components/responses/ConflictError' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /familles-impact/{familleId}:
    parameters:
      - { $ref: '#/components/parameters/FamilleId' }
    get:
      tags: [Familles d'impact]
      operationId: getFamille
      summary: Consulter une famille d'impact
      responses:
        '200':
          description: Famille trouvée
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FamilleImpact' }
        '404': { $ref: '#/components/responses/NotFoundError' }
    patch:
      tags: [Familles d'impact]
      operationId: updateFamille
      summary: Modifier une famille d'impact
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FamilleImpactUpdate' }
      responses:
        '200':
          description: Famille modifiée
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FamilleImpact' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '409': { $ref: '#/components/responses/ConflictError' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Familles d'impact]
      operationId: deleteFamille
      summary: Supprimer une famille d'impact sans membre actif
      responses:
        '204': { description: Famille supprimée }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '409': { $ref: '#/components/responses/ConflictError' }

  # ----------------------------------------------------------
  # AUDIT — LECTURE SEULE
  # ----------------------------------------------------------
  /audit-logs:
    get:
      tags: [Audit]
      operationId: listAuditLogs
      summary: Consulter les traces d'audit
      description: |
        Les traces sont créées automatiquement côté serveur.
        Aucun client ne peut écrire ou modifier un audit.
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
        - name: compteId
          in: query
          schema: { type: string, format: uuid }
        - name: entiteType
          in: query
          schema: { type: string, maxLength: 50 }
        - name: entiteId
          in: query
          schema: { type: string, format: uuid }
        - name: action
          in: query
          schema: { type: string, maxLength: 50 }
        - name: depuis
          in: query
          schema: { type: string, format: date-time }
        - name: jusqua
          in: query
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Liste paginée
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditLogPage' }
        '403': { $ref: '#/components/responses/ForbiddenError' }

  /audit-logs/{auditId}:
    parameters:
      - { $ref: '#/components/parameters/AuditId' }
    get:
      tags: [Audit]
      operationId: getAuditLog
      summary: Consulter une trace d'audit
      responses:
        '200':
          description: Trace trouvée
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditLog' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
