name: erp_centre_impact_chr-tienne

services:
  postgres:
    image: postgres:16-alpine
    container_name: erp_centre_impact_chr-tienne-postgres
    environment:
      POSTGRES_USER: erp_user
      POSTGRES_PASSWORD: erp_password
      POSTGRES_DB: erp_eglise
    # 5432 est déjà pris sur l'hôte : la base n'est joignable que dans le réseau du projet.
    volumes:
      - erp_centre_impact_chr-tienne_postgres_data:/var/lib/postgresql/data
    networks:
      - net_laravel

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: erp_centre_impact_chr-tienne-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@erp-eglise.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "8088:80"
    depends_on:
      - postgres
    volumes:
      - erp_centre_impact_chr-tienne_pgadmin_data:/var/lib/pgadmin
    networks:
      - net_laravel

  redis:
    image: redis:7-alpine
    container_name: erp_centre_impact_chr-tienne-redis
    ports:
      - "6379:6379"
    command: redis-server --requirepass redis_password
    volumes:
      - erp_centre_impact_chr-tienne_redis_data:/data
    networks:
      - net_laravel

  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: erp_centre_impact_chr-tienne-minio
    environment:
      MINIO_ROOT_USER: minio_access
      MINIO_ROOT_PASSWORD: minio_secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - erp_centre_impact_chr-tienne_minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - net_laravel

  mailpit:
    image: axllent/mailpit
    container_name: erp_centre_impact_chr-tienne-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - net_laravel

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: erp_centre_impact_chr-tienne-backend
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www/html
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: erp_eglise
      DB_USERNAME: erp_user
      DB_PASSWORD: erp_password
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: redis_password
      MAIL_HOST: mailpit
      MAIL_PORT: "1025"
      AWS_ENDPOINT: http://minio:9000
    depends_on:
      - postgres
      - redis
      - minio
      - mailpit
    networks:
      - net_laravel

volumes:
  erp_centre_impact_chr-tienne_postgres_data:
    name: erp_centre_impact_chr-tienne_postgres_data
  erp_centre_impact_chr-tienne_redis_data:
    name: erp_centre_impact_chr-tienne_redis_data
  erp_centre_impact_chr-tienne_minio_data:
    name: erp_centre_impact_chr-tienne_minio_data
  erp_centre_impact_chr-tienne_pgadmin_data:
    name: erp_centre_impact_chr-tienne_pgadmin_data

networks:
  net_laravel:
    name: erp_centre_impact_chr-tienne_net_laravel
    driver: bridge
