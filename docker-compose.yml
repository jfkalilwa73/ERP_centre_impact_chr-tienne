version: "3.9"

services:
  # 1. Base de données (PostgreSQL)
  postgres:
    image: postgres:16-alpine
    container_name: erp-postgres
    environment:
      POSTGRES_USER: erp_user
      POSTGRES_PASSWORD: erp_password
      POSTGRES_DB: erp_eglise
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - erp-network

  # pgAdmin - Interface de gestion PostgreSQL
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: erp-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@erp-eglise.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - erp-network
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  # 2. Cache et sessions (Redis)
  redis:
    image: redis:7-alpine
    container_name: erp-redis
    ports:
      - "6379:6379"
    command: redis-server --requirepass redis_password
    volumes:
      - redis_data:/data
    networks:
      - erp-network

  # 3. Stockage de fichiers (Silo, compatible S3)
  minio:
    image: docker.io/pgsty/silo:latest
    container_name: erp-minio
    environment:
      MINIO_ROOT_USER: minio_access
      MINIO_ROOT_PASSWORD: minio_secret
    ports:
      - "9000:9000" # API S3
      - "9001:9001" # Console Web
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - erp-network

  # 4. Serveur de test d'emails (Mailpit)
  mailpit:
    image: axllent/mailpit
    container_name: erp-mailpit
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Interface Web
    networks:
      - erp-network

  # 5. Backend Laravel (API)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: erp-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/var/www/html
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
    depends_on:
      - postgres
      - redis
      - minio
      - mailpit
    networks:
      - erp-network

  # 6. Frontend React (interface utilisateur)
  frontend:
    image: node:20-alpine
    container_name: erp-frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host"
    depends_on:
      - backend
    networks:
      - erp-network

# Volumes persistants
volumes:
  postgres_data:
  redis_data:
  minio_data:
  pgadmin_data:

# Réseau privé
networks:
  erp-network:
    driver: bridge
